[tox]
envlist = format, lint, mypy, pytest, ts
skipsdist = true
toxworkdir = {toxinidir}/.cache/tox

[testenv]
skip_install = true
allowlist_externals = uv, npm, bash
passenv = RELAY_LIVE, HOME, PATH
setenv = VIRTUAL_ENV = {toxinidir}/.venv

[testenv:format]
commands = uv run --frozen ruff format --check .

[testenv:lint]
commands = uv run --frozen ruff check .

[testenv:mypy]
commands = uv run --frozen mypy

[testenv:pytest]
commands = uv run --frozen pytest {posargs}

[testenv:ts]
commands = bash scripts/ts_check.sh
