<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2937">
  <title>agent-relay</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <section id="login" hidden>
    <h1>agent-relay</h1>
    <p>Paste the PWA token (Keychain item <code>agent-relay / pwa-token</code>).</p>
    <form id="login-form">
      <input id="token" type="password" autocomplete="off" required>
      <button type="submit">Connect</button>
    </form>
    <p id="login-error" class="error" hidden></p>
  </section>

  <main id="app" hidden>
    <nav id="threads">
      <header>
        <span id="status" class="dot" title="disconnected"></span>
        <strong>agent-relay</strong>
        <button id="logout" type="button" title="Forget the token">⏻</button>
      </header>
      <ul id="thread-list"></ul>
    </nav>
    <section id="thread">
      <header id="thread-title">Top level</header>
      <ol id="messages"></ol>
      <form id="composer">
        <textarea id="text" rows="2" placeholder="/help, /new, or a prompt in a session" required></textarea>
        <button type="submit">Send</button>
      </form>
    </section>
  </main>
</body>
</html>
