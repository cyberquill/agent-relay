<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>fixture-ws — Cursor</title>
</head>
<body>
<!-- Shaped after Cursor 3.23.12's chat pane (selectors v2): the header "New Agent" link, the model picker
     button around its text span, and one send slot that turns into Stop while a turn runs. -->
<div class="composer-pane">
  <a class="action-label codicon codicon-add-two" role="button" id="new-chat"
     aria-label="New Agent (⌘N)&#10;[⌥] Replace Agent">+</a>
  <div class="conversations"></div>
  <div class="composer-bar">
    <div class="aislash-editor-input" contenteditable="true" role="textbox"></div>
    <button type="button" id="picker"><span class="vscode-model-picker__trigger-text">Auto</span></button>
    <div id="menu" hidden></div>
    <div class="send-with-mode">
      <div class="anysphere-icon-button" id="send"><span class="label">Send</span></div>
    </div>
  </div>
</div>
<script>
const MODELS = ["Auto", "GPT-5", "Sonnet 4.5"];
const conversations = document.querySelector(".conversations");
const composer = document.querySelector(".aislash-editor-input");
const picker = document.getElementById("picker");
const pickerText = picker.querySelector(".vscode-model-picker__trigger-text");
const menu = document.getElementById("menu");
const sendButton = document.getElementById("send");
window.__prompts = [];
let timers = [];

function stopIcon() { return sendButton.querySelector(".codicon-debug-stop"); }

function finish() {
  timers.forEach(clearTimeout);
  timers = [];
  const stop = stopIcon();
  if (stop) { stop.remove(); }
}

function reply(prompt) {
  if (prompt.includes("Reply with exactly: OK")) { return {tokens: ["O", "K"], pace: 30}; }
  if (prompt.includes("slow")) { return {tokens: Array.from({length: 50}, (_, i) => `t${i} `), pace: 200}; }
  if (prompt.includes("silent")) { return {tokens: [], pace: 30}; }
  return {tokens: ["Echo: ", prompt], pace: 30};
}

// Cursor swaps the chat a moment after the click, so the old replies are still on the page at first.
// Only what was there at the click leaves; anything sent into the new chat meanwhile stays.
document.getElementById("new-chat").addEventListener("click", () => {
  finish();
  const old = [...conversations.children];
  setTimeout(() => old.forEach((node) => node.remove()), 150);
});

picker.addEventListener("click", () => {
  menu.replaceChildren(...MODELS.map((label) => {
    const item = document.createElement("div");
    item.setAttribute("data-testid", "model-picker-item");
    item.textContent = label;
    item.addEventListener("click", () => { pickerText.textContent = label; menu.hidden = true; });
    return item;
  }));
  menu.hidden = false;
});

document.addEventListener("keydown", (event) => { if (event.key === "Escape") { menu.hidden = true; } });

sendButton.addEventListener("click", () => {
  if (stopIcon()) { finish(); return; }
  const prompt = composer.innerText.trim();
  composer.replaceChildren();
  window.__prompts.push({prompt, model: pickerText.textContent});
  const user = document.createElement("div");
  user.setAttribute("data-message-role", "human");
  user.textContent = prompt;
  conversations.append(user);
  const ai = document.createElement("div");
  ai.setAttribute("data-message-role", "ai");
  conversations.append(ai);
  const stop = document.createElement("span");
  stop.className = "codicon codicon-debug-stop";
  stop.textContent = "Stop";
  sendButton.append(stop);
  const {tokens, pace} = reply(prompt);
  tokens.forEach((token, i) => {
    timers.push(setTimeout(() => { ai.textContent += token; }, pace * (i + 1)));
  });
  timers.push(setTimeout(finish, pace * (tokens.length + 2)));
});
</script>
</body>
</html>
