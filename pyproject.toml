[project]
name = "agent-relay"
version = "0.1.0"
description = "Control VS Code Copilot, Cursor and OpenCode on this Mac from a phone over Webex"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13, <3.14"
dependencies = [
    "pydantic~=2.11",
    "typer~=0.16",
    "rich~=14.0",
    "keyring~=25.6",
    "httpx~=0.28",
    "websockets~=15.0",
    "fastapi~=0.115",
    "uvicorn~=0.34",
    "mcp~=1.12",
    "pyyaml~=6.0",
    "tomli-w~=1.2",
    "certifi>=2026.7.22",
]

[project.optional-dependencies]
cdp = ["playwright~=1.52"]

[dependency-groups]
dev = [
    "mypy~=1.16",
    "pytest~=8.4",
    "pytest-asyncio~=1.0",
    "hypothesis~=6.135",
    "ruff~=0.12",
    "tox~=4.27",
    "types-PyYAML~=6.0",
    "playwright~=1.52",
    "jsonschema~=4.26",
    "types-jsonschema~=4.26",
]

[project.scripts]
relay = "agent_relay.cli:app"
relayd = "agent_relay.daemon:main"
relay-hook = "agent_relay.hook.relay_hook:main"
relay-mcp = "agent_relay.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
cache_dir = ".cache/pytest"
addopts = ["--strict-markers", "--tb=short", "-q"]
markers = ["live: needs RELAY_LIVE=1 and the real apps"]

[tool.mypy]
python_version = "3.13"
cache_dir = ".cache/mypy"
files = ["agent_relay", "tests", "scripts/smoke_live.py"]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "possibly-undefined", "redundant-expr"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["keyring.*", "webex_bot.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 110
target-version = "py313"
cache-dir = ".cache/ruff"
extend-exclude = [".scratch", "extensions", "plugins", "node_modules", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "ANN", "PGH", "B", "UP", "RUF100", "T20"]

[tool.ruff.lint.per-file-ignores]
"agent_relay/cli.py" = ["T20"]
"agent_relay/doctor/render.py" = ["T20"]
"scripts/**" = ["T20"]
